<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Document</title>
</head>
<body>

<main>
    <h1 class="text-center pt-4 pb-3">Contact Book</h1>
    <hr>
    <div class="container">
        <div class="row">
            <!-- Form -->
            <div class="col-4">
                <h2>Create Contact</h2>
                <hr>
                <form data-form>
                    <div class="mb-2">
                        <label for="firstNameInput" class="form-label">First name</label>
                        <input name="firstName" type="text" class="form-control" id="firstNameInput" placeholder="First name">
                    </div>
                    <div class="mb-2">
                        <label for="lastNameInput" class="form-label">Last name</label>
                        <input name="lastName" type="text" class="form-control" id="lastNameInput" placeholder="Last name">
                    </div>
                    <div class="mb-3">
                        <label for="phoneNumberInput" class="form-label">Phone number</label>
                        <input name="phone" type="tel" class="form-control" id="phoneNumberInput" placeholder="Phone number">
                    </div>
                    <button disabled type="submit" class="btn btn-success">Save</button>
                </form>
            </div>
            <!-- List -->
            <div class="col-4">
                <h2>Contacts</h2>
                <hr>
                <ul class="list-group" data-contacts-list>
                </ul>
            </div>
        </div>
    </div>
</main>

<!-- MVC -->
<script src="./js/model.js"></script>
<script src="./js/view.js"></script>
<!--<script src="js/model-array.js"></script>-->
<script src="js/controller.js"></script>
</body>
</html>
